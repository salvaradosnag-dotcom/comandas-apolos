<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comandas Apolo's</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1c1b19;--mut:#76716a;--acc:#c2410c;--acc2:#fde7d9;--line:#e7e1d8}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}
.num{font-weight:700;background:var(--ink);color:#fff;border-radius:8px;padding:4px 10px}
main{max-width:560px;margin:0 auto;padding:0 12px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{border:1px solid var(--line);background:#fffaf5;border-radius:12px;padding:12px 8px;text-align:left;font-size:15px;font-weight:600;color:var(--ink)}
.item small{display:block;font-weight:400;color:var(--mut);margin-top:2px}
.item:active{background:var(--acc2)}
.line{border-top:1px solid var(--line);padding:10px 0}
.line:first-child{border-top:0}
.lrow{display:flex;align-items:center;gap:8px}
.lname{flex:1;font-weight:600}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700}
.qty span{min-width:22px;text-align:center;font-weight:700;font-size:17px}
.del{border:0;background:none;color:var(--mut);font-size:20px;padding:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:13px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
input,textarea,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(246,243,238,.96);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.bar button{flex:1;max-width:270px;padding:14px;border-radius:12px;border:0;font-weight:700;font-size:16px}
.pri{background:var(--acc);color:#fff}
.sec{background:#fff;border:1px solid var(--line)!important;color:var(--ink)}
.empty{color:var(--mut);font-size:14px;text-align:center;padding:8px}
#out{display:none}
#out img{display:block;margin:10px auto;max-width:100%;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.hint{font-size:14px;color:var(--mut);line-height:1.45}
.hint b{color:var(--ink)}
.mini{font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#fff}
.prow{display:flex;gap:6px;margin-bottom:6px}
.prow input{padding:8px}
.prow input.p{width:90px;flex:none}
.prow select{width:110px;flex:none;padding:8px}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header><h1>Comandas Apolo's</h1><span class="num" id="numTag">#1</span></header>
<main>
  <div id="form">
    <div class="card">
      <h2>Agregar</h2>
      <div id="menu"></div>
    </div>

    <div class="card">
      <h2>Pedido</h2>
      <div id="lines"></div>
      <div class="total" id="totalRow"><span>Total</span><span id="total">$0</span></div>
    </div>

    <div class="card">
      <h2>Cliente</h2>
      <label>Nombre</label><input id="cliente" placeholder="Ej: Juan">
      <label>Teléfono</label><input id="fono" inputmode="tel" placeholder="+56 9 ...">
      <label>Tipo</label>
      <div class="seg" id="tipo"><button data-v="Retiro" class="on">Retiro</button><button data-v="Delivery">Delivery</button></div>
      <div id="dirWrap" style="display:none"><label>Dirección</label><input id="dir" placeholder="Calle, número, referencia"></div>
      <label>Hora de entrega</label><input id="hora" placeholder="Ej: 13:30 / Lo antes posible">
      <label>Pago</label>
      <div class="seg" id="pago"><button data-v="Efectivo" class="on">Efectivo</button><button data-v="Transferencia">Transf.</button><button data-v="Tarjeta">Tarjeta</button></div>
      <label style="display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px;margin-top:10px"><input type="checkbox" id="pagado" style="width:auto"> Ya pagado</label>
      <label>Observaciones</label><textarea id="obs" rows="2" placeholder="Ej: tocar timbre, vuelto de $10.000"></textarea>
    </div>

    <div class="card">
      <h2>Menú y precios <button class="mini" id="toggleCfg" style="float:right">Editar</button></h2>
      <div id="cfg" style="display:none">
        <div id="cfgRows"></div>
        <button class="mini" id="addProd">+ Producto</button>
        <button class="mini" id="saveCfg" style="float:right;background:var(--ink);color:#fff">Guardar</button>
        <label style="margin-top:14px">N° de la próxima comanda</label><input id="numIn" inputmode="numeric" style="width:120px">
        <label style="margin-top:14px">Intensidad de impresión (más alto = más oscuro)</label>
        <input type="range" id="energy" min="10" max="100" step="5">
        <button class="mini" id="testPrint" style="margin-top:8px">Imprimir prueba</button>
      </div>
      <div class="hint" id="cfgHint">Precios de ejemplo. Toca "Editar" para poner los reales.</div>
    </div>
  </div>

  <div id="out">
    <div class="card">
      <div class="hint"><b>Para imprimir:</b> mantén presionada la imagen → <b>Guardar en Fotos</b> (o hazle captura) → abre <b>Tiny Print</b> → imprime la foto con ancho completo.</div>
      <div id="prnBox" style="margin:8px 0"></div>
      <img id="img" alt="Comanda">
      <button class="mini" id="copyTxt">Copiar como texto</button>
      <button class="mini" id="shareImg">Compartir imagen</button>
    </div>
  </div>
</main>

<div class="bar" id="barForm"><button class="sec" id="clearBtn">Limpiar</button><button class="pri" id="genBtn">Generar comanda</button></div>
<div class="bar" id="barOut" style="display:none"><button class="sec" id="backBtn">Editar</button><button class="pri" id="printBtn">🖨 Imprimir</button><button class="sec" id="newBtn">Nueva</button></div>
<div class="toast" id="toast"></div>

<script>
const DEFAULT_MENU=[
 {cat:"Empanadas",name:"Empanada de pino",price:2500},
 {cat:"Empanadas",name:"Empanada de queso",price:2000},
 {cat:"Empanadas",name:"Empanada napolitana",price:2500},
 {cat:"Empanadas",name:"Empanada pollo",price:2500},
 {cat:"Completos",name:"Completo",price:2500},
 {cat:"Completos",name:"Italiano",price:3000},
 {cat:"Completos",name:"Dinámico",price:3500},
 {cat:"Completos",name:"As italiano",price:4500},
 {cat:"Bebidas",name:"Bebida lata",price:1500},
 {cat:"Bebidas",name:"Jugo",price:1500}
];
const MODS={
 "Empanadas":["Frita","Al horno","Sin aceituna","Sin huevo"],
 "Completos":["Sin mayo","Extra mayo","Sin palta","Sin tomate","Sin chucrut","Sin ketchup","Sin mostaza"],
 "Bebidas":["Coca-Cola","Fanta","Sprite","Zero"]
};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let menu=store.get("apolos_menu",DEFAULT_MENU);
let num=store.get("apolos_num",1);
let lines=[];let tipo="Retiro",pago="Efectivo";
const $=id=>document.getElementById(id);
const clp=n=>"$"+Math.round(n).toLocaleString("es-CL");
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1400)}

function renderMenu(){
  const cats=[...new Set(menu.map(m=>m.cat))];
  $("menu").innerHTML=cats.map(c=>`<label style="margin-top:4px">${c}</label><div class="grid">`+
   menu.map((m,i)=>m.cat===c?`<button class="item" data-i="${i}">${esc(m.name)}<small>${clp(m.price)}</small></button>`:"").join("")+`</div>`).join("");
  $("menu").querySelectorAll(".item").forEach(b=>b.onclick=()=>addItem(+b.dataset.i));
  $("numTag").textContent="#"+num;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function addItem(i){
  const m=menu[i];const last=lines[lines.length-1];
  if(last&&last.name===m.name&&!last.mods.length&&!last.note){last.qty++}
  else lines.push({name:m.name,cat:m.cat,price:m.price,qty:1,mods:[],note:""});
  renderLines();toast("+1 "+m.name);
}
function renderLines(){
  if(!lines.length){$("lines").innerHTML='<div class="empty">Toca un producto para agregarlo</div>'}
  else $("lines").innerHTML=lines.map((l,i)=>`<div class="line">
    <div class="lrow"><div class="lname">${esc(l.name)}<div style="font-weight:400;color:var(--mut);font-size:13px">${clp(l.price*l.qty)}</div></div>
    <div class="qty"><button data-a="m" data-i="${i}">−</button><span>${l.qty}</span><button data-a="p" data-i="${i}">+</button></div>
    <button class="del" data-a="d" data-i="${i}">✕</button></div>
    <div class="chips">${(MODS[l.cat]||[]).map(md=>`<button class="chip ${l.mods.includes(md)?"on":""}" data-a="c" data-i="${i}" data-m="${esc(md)}">${esc(md)}</button>`).join("")}</div>
    <input style="margin-top:8px;padding:8px;font-size:14px" placeholder="Nota (opcional)" data-a="n" data-i="${i}" value="${esc(l.note)}">
  </div>`).join("");
  $("lines").querySelectorAll("[data-a]").forEach(el=>{
    const i=+el.dataset.i,a=el.dataset.a;
    if(a==="n"){el.oninput=()=>lines[i].note=el.value;return}
    el.onclick=()=>{const l=lines[i];
      if(a==="p")l.qty++;else if(a==="m"){l.qty--;if(l.qty<1)lines.splice(i,1)}
      else if(a==="d")lines.splice(i,1);
      else if(a==="c"){const md=el.dataset.m;l.mods=l.mods.includes(md)?l.mods.filter(x=>x!==md):[...l.mods,md]}
      renderLines()};
  });
  const t=lines.reduce((s,l)=>s+l.price*l.qty,0);$("total").textContent=clp(t);
}
function seg(id,cb){$(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{$(id).querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");cb(b.dataset.v)})}
seg("tipo",v=>{tipo=v;$("dirWrap").style.display=v==="Delivery"?"block":"none"});
seg("pago",v=>pago=v);

/* ---------- ticket render (384px = 58mm @203dpi) ---------- */
function wrap(ctx,text,maxW){
  const words=String(text).split(/\s+/);const out=[];let cur="";
  for(const w of words){const t=cur?cur+" "+w:w;if(ctx.measureText(t).width>maxW&&cur){out.push(cur);cur=w}else cur=t}
  if(cur)out.push(cur);return out.length?out:[""];
}
function buildTicket(){
  const W=384,P=8,F="-apple-system,system-ui,Helvetica,Arial,sans-serif";
  const ops=[];// collect draw ops then measure height
  const c=document.createElement("canvas");const ctx=c.getContext("2d");
  let y=0;
  const text=(t,size,{bold=false,align="left",gap=6,indent=0}={})=>{
    ctx.font=`${bold?"800":"500"} ${size}px ${F}`;
    for(const ln of wrap(ctx,t,W-2*P-indent)){y+=size+2;ops.push({k:"t",t:ln,size,bold,align,y,indent})}
    y+=gap;
  };
  const rule=(dash)=>{y+=4;ops.push({k:"r",y,dash});y+=10};
  const row=(l,r,size,bold)=>{y+=size+2;ops.push({k:"row",l,r,size,bold,y});y+=6};
  const now=new Date();
  const fecha=now.toLocaleDateString("es-CL")+" "+now.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
  text("APOLO'S",40,{bold:true,align:"center",gap:2});
  text("Comida casera",20,{align:"center",gap:8});
  rule();
  row("COMANDA #"+num,"",34,true);
  text(fecha,20,{gap:4});
  text(tipo.toUpperCase()+(($("hora").value.trim())?" · "+$("hora").value.trim():""),26,{bold:true,gap:4});
  rule(true);
  if($("cliente").value.trim())text("Cliente: "+$("cliente").value.trim(),24,{bold:true,gap:2});
  if($("fono").value.trim())text("Fono: "+$("fono").value.trim(),22,{gap:2});
  if(tipo==="Delivery"&&$("dir").value.trim())text("Dir: "+$("dir").value.trim(),24,{bold:true,gap:2});
  rule();
  // group by category
  const cats=[...new Set(lines.map(l=>l.cat))];
  for(const cat of cats){
    const ls=lines.filter(l=>l.cat===cat);const n=ls.reduce((s,l)=>s+l.qty,0);
    text(cat.toUpperCase()+" ("+n+")",20,{bold:true,gap:4});
    for(const l of ls){
      row(l.qty+"x "+l.name,"",30,true);
      if(l.mods.length)text("→ "+l.mods.join(", "),24,{bold:true,indent:18,gap:2});
      if(l.note)text("→ "+l.note,24,{indent:18,gap:2});
      y+=6;
    }
  }
  rule();
  const tot=lines.reduce((s,l)=>s+l.price*l.qty,0);
  if(tot>0)row("TOTAL",clp(tot),32,true);
  text("Pago: "+pago+($("pagado").checked?" · PAGADO":" · POR COBRAR"),24,{bold:true,gap:4});
  if($("obs").value.trim()){rule(true);text("Obs: "+$("obs").value.trim(),24,{bold:true,gap:4})}
  rule();
  text("¡Gracias!",22,{align:"center",gap:24});
  c.width=W;c.height=Math.ceil(y);
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,c.height);ctx.fillStyle="#000";ctx.strokeStyle="#000";ctx.textBaseline="alphabetic";
  for(const o of ops){
    if(o.k==="t"){ctx.font=`${o.bold?"800":"500"} ${o.size}px ${F}`;ctx.textAlign=o.align;
      ctx.fillText(o.t,o.align==="center"?W/2:P+o.indent,o.y-4)}
    else if(o.k==="row"){ctx.font=`${o.bold?"800":"500"} ${o.size}px ${F}`;
      ctx.textAlign="left";let l=o.l;const rw=o.r?ctx.measureText(o.r).width+12:0;
      while(ctx.measureText(l).width>W-2*P-rw&&l.length>3)l=l.slice(0,-2)+"…";
      ctx.fillText(l,P,o.y-4);if(o.r){ctx.textAlign="right";ctx.fillText(o.r,W-P,o.y-4)}}
    else{ctx.lineWidth=3;ctx.setLineDash(o.dash?[8,6]:[]);ctx.beginPath();ctx.moveTo(P,o.y);ctx.lineTo(W-P,o.y);ctx.stroke();ctx.setLineDash([])}
  }
  return c.toDataURL("image/png");
}
function ticketText(){
  const L=[];L.push("APOLO'S - COMANDA #"+num);L.push(new Date().toLocaleString("es-CL"));
  L.push(tipo+($("hora").value.trim()?" · "+$("hora").value.trim():""));
  if($("cliente").value.trim())L.push("Cliente: "+$("cliente").value.trim());
  if($("fono").value.trim())L.push("Fono: "+$("fono").value.trim());
  if(tipo==="Delivery"&&$("dir").value.trim())L.push("Dir: "+$("dir").value.trim());
  L.push("----------");
  lines.forEach(l=>{L.push(l.qty+"x "+l.name);if(l.mods.length)L.push("  > "+l.mods.join(", "));if(l.note)L.push("  > "+l.note)});
  L.push("----------");const t=lines.reduce((s,l)=>s+l.price*l.qty,0);if(t)L.push("TOTAL "+clp(t));
  L.push("Pago: "+pago+($("pagado").checked?" (pagado)":" (por cobrar)"));
  if($("obs").value.trim())L.push("Obs: "+$("obs").value.trim());
  return L.join("\n");
}
function show(out){$("form").style.display=out?"none":"block";$("out").style.display=out?"block":"none";
  $("barForm").style.display=out?"none":"flex";$("barOut").style.display=out?"flex":"none";window.scrollTo(0,0)}
$("genBtn").onclick=()=>{if(!lines.length){toast("Agrega al menos un producto");return}
  $("img").src=buildTicket();show(true)};
$("backBtn").onclick=()=>show(false);
function clearForm(){lines=[];["cliente","fono","dir","hora","obs"].forEach(i=>$(i).value="");$("pagado").checked=false;renderLines()}
$("clearBtn").onclick=clearForm;
$("newBtn").onclick=()=>{num++;store.set("apolos_num",num);clearForm();renderMenu();show(false)};
$("copyTxt").onclick=async()=>{try{await navigator.clipboard.writeText(ticketText());toast("Copiado")}catch(e){toast("No se pudo copiar")}};

/* ---------- config ---------- */
function renderCfg(){
  const cats=[...new Set([...Object.keys(MODS),...menu.map(m=>m.cat)])];
  $("cfgRows").innerHTML=menu.map((m,i)=>`<div class="prow">
   <select data-i="${i}" data-f="cat">${cats.map(c=>`<option ${c===m.cat?"selected":""}>${esc(c)}</option>`).join("")}</select>
   <input data-i="${i}" data-f="name" value="${esc(m.name)}">
   <input class="p" data-i="${i}" data-f="price" inputmode="numeric" value="${m.price}">
   <button class="del" data-x="${i}">✕</button></div>`).join("");
  $("cfgRows").querySelectorAll("[data-f]").forEach(el=>el.oninput=el.onchange=()=>{const m=menu[+el.dataset.i];
    m[el.dataset.f]=el.dataset.f==="price"?(parseInt(el.value.replace(/\D/g,""))||0):el.value});
  $("cfgRows").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{menu.splice(+b.dataset.x,1);renderCfg()});
  $("numIn").value=num;
}
$("toggleCfg").onclick=()=>{const o=$("cfg").style.display==="none";$("cfg").style.display=o?"block":"none";$("cfgHint").style.display=o?"none":"block";$("toggleCfg").textContent=o?"Cerrar":"Editar";if(o)renderCfg()};
$("addProd").onclick=()=>{menu.push({cat:"Empanadas",name:"Nuevo producto",price:0});renderCfg()};
$("saveCfg").onclick=()=>{menu=menu.filter(m=>m.name.trim());num=parseInt($("numIn").value)||num;
  store.set("apolos_menu",menu);store.set("apolos_num",num);renderMenu();renderCfg();toast("Guardado")};

/* ---------- impresora X6h / cat printer por Web Bluetooth ---------- */
const SVC=0xae30,TXC=0xae01,RXC=0xae02;
let bt={dev:null,tx:null,paused:false,chunk:180,busy:false};
let energyPct=store.get("apolos_energy",70);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function crc8(d){let c=0;for(const b of d){c^=b;for(let i=0;i<8;i++)c=(c&0x80)?((c<<1)^0x07)&0xff:(c<<1)&0xff}return c}
function pc(id,data){data=Array.from(data);return [0x51,0x78,id,0x00,data.length&0xff,(data.length>>8)&0xff,...data,crc8(data),0xff]}
function prnStatus(msg,ok){$("prnBox").innerHTML=`<div class="hint" style="color:${ok?"#15803d":"var(--mut)"}">${msg}</div>`+
  (bt.tx?"":`<button class="mini" id="connBtn" style="margin-top:6px">Conectar impresora</button>`);
  const b=$("connBtn");if(b)b.onclick=()=>connect().catch(e=>prnStatus("No se pudo conectar: "+e.message))}
async function connect(){
  if(!navigator.bluetooth)throw new Error("este navegador no tiene Bluetooth. Usa Chrome en Android (o Bluefy en iPhone).");
  const dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:"X6"},{namePrefix:"MX"},{namePrefix:"GB"},{namePrefix:"GT"},{namePrefix:"YT"},{services:[SVC]}],optionalServices:[SVC]});
  prnStatus("Conectando a "+dev.name+"…");
  const srv=await dev.gatt.connect();const s=await srv.getPrimaryService(SVC);
  bt.tx=await s.getCharacteristic(TXC);bt.dev=dev;
  try{const rx=await s.getCharacteristic(RXC);await rx.startNotifications();
    rx.addEventListener("characteristicvaluechanged",e=>{const v=new Uint8Array(e.target.value.buffer);
      if(v[0]===0x51&&v[2]===0xae)bt.paused=v[6]===0x10})}catch(e){}
  dev.addEventListener("gattserverdisconnected",()=>{bt.tx=null;prnStatus("Impresora desconectada")});
  prnStatus("✓ Conectada: "+dev.name,true);
}
async function write(bytes){
  let i=0;
  while(i<bytes.length){
    while(bt.paused)await sleep(30);
    const part=new Uint8Array(bytes.slice(i,i+bt.chunk));
    try{bt.tx.writeValueWithoutResponse?await bt.tx.writeValueWithoutResponse(part):await bt.tx.writeValue(part);i+=part.length}
    catch(e){if(bt.chunk>20){bt.chunk=20;continue}throw e}
    await sleep(bt.chunk>20?12:6);
  }
}
function canvasToLines(canvas){
  const ctx=canvas.getContext("2d");const {width:w,height:h}=canvas;const px=ctx.getImageData(0,0,w,h).data;const rows=[];
  for(let y=0;y<h;y++){const row=new Array(48).fill(0);
    for(let x=0;x<Math.min(w,384);x++){const k=(y*w+x)*4;const lum=0.299*px[k]+0.587*px[k+1]+0.114*px[k+2];
      if(lum<140&&px[k+3]>100)row[x>>3]|=1<<(x&7)}
    rows.push(row)}
  return rows;
}
async function printCanvas(canvas){
  if(bt.busy)return;
  if(!bt.tx)await connect();
  bt.busy=true;$("printBtn").textContent="Imprimiendo…";
  try{
    const e=Math.round(0xffff*energyPct/100);
    let buf=[...pc(0xa3,[0]),...pc(0xa4,[0x33]),...pc(0xaf,[e&0xff,e>>8]),...pc(0xbe,[1]),...pc(0xbd,[0x20]),...pc(0xa9,[0]),
      ...pc(0xa6,[0xaa,0x55,0x17,0x38,0x44,0x5f,0x5f,0x5f,0x44,0x38,0x2c])];
    await write(buf);
    const rows=canvasToLines(canvas);
    for(let i=0;i<rows.length;i+=3){let b=[];for(const r of rows.slice(i,i+3))b.push(...pc(0xa2,r));await write(b)}
    await write([...pc(0xa1,[0x60,0x00]),...pc(0xa6,[0xaa,0x55,0x17,0,0,0,0,0,0,0,0x17]),...pc(0xa3,[0])]);
    toast("Impreso");
  }finally{bt.busy=false;$("printBtn").textContent="🖨 Imprimir"}
}
let lastCanvas=null;
const _build=buildTicket;
buildTicket=function(){const url=_build();const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=im.width;c.height=im.height;c.getContext("2d").drawImage(im,0,0);lastCanvas=c};im.src=url;return url};
$("printBtn").onclick=()=>{if(!lastCanvas)return;printCanvas(lastCanvas).catch(e=>{prnStatus("Error al imprimir: "+e.message);toast("No imprimió")})};
$("testPrint").onclick=()=>{const c=document.createElement("canvas");c.width=384;c.height=170;const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,384,170);x.fillStyle="#000";x.font="800 34px sans-serif";x.fillText("PRUEBA APOLO'S",10,50);
  x.font="600 24px sans-serif";x.fillText("Intensidad "+energyPct+"%",10,95);x.fillRect(10,115,364,30);
  printCanvas(c).catch(e=>toast("Error: "+e.message))};
$("energy").value=energyPct;$("energy").oninput=e=>{energyPct=+e.target.value;store.set("apolos_energy",energyPct)};
$("shareImg").onclick=async()=>{try{const blob=await (await fetch($("img").src)).blob();
  const f=new File([blob],"comanda-"+num+".png",{type:"image/png"});await navigator.share({files:[f]})}catch(e){toast("Mantén presionada la imagen para guardarla")}};
const _gen=$("genBtn").onclick;$("genBtn").onclick=()=>{_gen();if(lines.length)prnStatus(bt.tx?"✓ Conectada: "+bt.dev.name:"Impresora no conectada",!!bt.tx)};

renderMenu();renderLines();
</script>
